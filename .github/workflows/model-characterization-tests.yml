name: Model characterization tests

on:
  pull_request:
    paths:
      - 'Passero.Framework/**'
      - 'Directory.Build.props'
      - 'tests/Passero.Framework.Model.Tests/**'
      - 'tests/Passero.Framework.Model.RuntimeProbe/**'
      - 'tests/Passero.Framework.DemoDb.ReadOnlyProbe/**'
      - '.github/workflows/model-characterization-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-net8:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore runtime probe
        run: dotnet restore tests/Passero.Framework.Model.RuntimeProbe/Passero.Framework.Model.RuntimeProbe.csproj
      - name: Run 8 direct runtime assertions (nonzero exit on failure)
        run: dotnet run --project tests/Passero.Framework.Model.RuntimeProbe/Passero.Framework.Model.RuntimeProbe.csproj --framework net8.0 --configuration Release --no-restore
      - name: Restore xUnit test project
        run: dotnet restore tests/Passero.Framework.Model.Tests/Passero.Framework.Model.Tests.csproj
      - name: Run xUnit characterization tests
        run: dotnet test tests/Passero.Framework.Model.Tests/Passero.Framework.Model.Tests.csproj --framework net8.0 --no-restore --configuration Release --logger "trx;LogFileName=model-net8.trx" --results-directory TestResults
      - name: Reject zero discovered xUnit tests
        shell: pwsh
        run: |
          [xml]$trx = Get-Content TestResults/model-net8.trx
          $counters = $trx.TestRun.ResultSummary.Counters
          if (-not $counters -or [int]$counters.total -eq 0) {
            throw "xUnit reported zero discovered tests. A successful build is not a successful test execution."
          }
          Write-Host "xUnit discovered $($counters.total) tests; passed $($counters.passed); failed $($counters.failed)"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-net8-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  framework-target-build:
    name: Compile core (${{ matrix.tfm }})
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        tfm: [net48, net8.0, net9.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build production core without changes
        run: dotnet build Passero.Framework/Passero.Framework.csproj --framework ${{ matrix.tfm }} --configuration Release

  demo-pubs-readonly:
    name: Demo pubs DB (read-only; optional)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PASSERO_DEMO_DB_CONNECTION_STRING: ${{ secrets.PASSERO_DEMO_DB_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check demo DB connection configuration
        id: availability
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PASSERO_DEMO_DB_CONNECTION_STRING)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Host "SKIPPED: demo DB credential not configured; no LIVE DB test was executed."
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
            Write-Host "Demo DB credential configured; starting read-only LIVE checks."
          }
      - name: Run real Pubs read-only checks with Dapper and EF Core
        if: steps.availability.outputs.configured == 'true'
        run: dotnet run --project tests/Passero.Framework.DemoDb.ReadOnlyProbe/Passero.Framework.DemoDb.ReadOnlyProbe.csproj --framework net8.0 --configuration Release
